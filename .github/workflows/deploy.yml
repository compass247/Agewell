name: Deploy

# On every push to main: apply infrastructure (Terraform) FIRST, then update the
# lead-form Lambda. Infra runs before code so any new infra (env vars, DB
# changes, etc.) is ready before the new code runs.
#
# The marketing site is served by Cloudflare Pages (static export) — deployed by
# Cloudflare on push to main, NOT here. The PHI portal is deployed by the separate
# `deploy-phi.yml` workflow. The old web ECS/ALB service was removed in the cost
# migration, so this workflow no longer builds or deploys a web container.
#
# Required repo settings:
#   Secrets:   AWS_DEPLOY_ROLE_ARN, CLOUDFLARE_API_TOKEN, TF_STATE_BUCKET
#   Variables: AWS_REGION, LEAD_LAMBDA_NAME, CLOUDFLARE_ZONE_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # for OIDC
  contents: read

jobs:
  # ---------------- Infra: terraform apply (runs first) ----------------
  infra:
    runs-on: ubuntu-latest
    # Gate: `terraform apply -auto-approve` on every push to main is a data-loss
    # hazard (e.g. a DynamoDB replace in an unreviewed plan). Configure the
    # `production` environment in repo Settings → Environments with a required
    # reviewer to make this job wait for approval. Until that's configured the
    # environment is a no-op (plans are still previewed on PRs by ci.yml).
    environment: production
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      # Empty until the PHI_TUNNEL_TOKEN secret is created — then the portal
      # canary (phi-canary.tf) comes up on the next apply.
      TF_VAR_portal_tunnel_token: ${{ secrets.PHI_TUNNEL_TOKEN }}
      # The canary must run the SAME image as the live portal (deploy-phi.yml
      # updates the portal image outside Terraform). Set PHI_CANARY_IMAGE to the
      # current phi-<sha> tag while the canary is up; empty → canary disabled
      # path or a bootstrap placeholder, so keep it in sync during the P2 soak.
      TF_VAR_portal_canary_image: ${{ vars.PHI_CANARY_IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Lambda zips are produced by archive_file from backend/lead-handler and
      # backend/lead-sync, so their production deps must be present before apply.
      - name: Prepare Lambda deps (lead-handler)
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: backend/lead-handler

      - name: Prepare Lambda deps (lead-sync)
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: backend/lead-sync

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=agewell-tf-lock"

      - name: Terraform apply
        run: terraform apply -auto-approve

  # ---------------- Deploy: update the lead-form Lambda ----------------
  # (Marketing → Cloudflare Pages; PHI portal → deploy-phi.yml. No web container.)
  deploy-lambda:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update lead Lambda
        working-directory: backend/lead-handler
        run: |
          npm ci --omit=dev --no-audit --no-fund
          zip -rq ../../lead-handler.zip . -x "build.mjs"
          cd ../..
          aws lambda update-function-code \
            --function-name "${{ vars.LEAD_LAMBDA_NAME }}" \
            --zip-file fileb://lead-handler.zip \
            --query 'LastModified' --output text
